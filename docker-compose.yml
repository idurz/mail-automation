services:
  rspamd:
    image: rspamd/rspamd:latest
    restart: unless-stopped
    volumes:
      - rspamd-data:/var/lib/rspamd

  mail-automation:
    image: ghcr.io/idurz/mail-automation:latest
    restart: unless-stopped
    environment:
      IMAP_ACCOUNTS: ${IMAP_ACCOUNTS:?Set IMAP_ACCOUNTS to a JSON list of IMAP accounts}
      RSPAMD_URL: http://rspamd:11333
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - mail-automation-data:/data

volumes:
  mail-automation-data:
  rspamd-data:
 