<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail Automation</title>
  <style>
    :root { font-family: Georgia, serif; color: #1c2b32; background: #eef2ed; }
    body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; } h2 { margin-top: 2rem; }
    form, table { width: 100%; border-collapse: collapse; background: #fff; }
    form { display: grid; gap: .6rem; padding: 1rem; box-sizing: border-box; }
    .field { display: grid; grid-template-columns: 10rem minmax(0, 1fr); align-items: center; gap: .6rem; font: 600 .85rem sans-serif; }
    .field span { text-align: right; } .hidden { display: none; }
    input, select, button { padding: .4rem .55rem; font: inherit; }
    button { background: #145a4f; color: white; border: 0; cursor: pointer; } button.delete { background: #9b2c2c; }
    .icon-button { width: 2.25rem; height: 2.25rem; padding: 0; font-size: 1.1rem; line-height: 1; }
    th, td { padding: .6rem; border-bottom: 1px solid #d8ded8; text-align: left; vertical-align: top; } th { background: #dfe8dd; }
    .table-wrap { overflow-x: auto; } .muted { color: #52676a; }
  </style>
</head>
<body>
  <h1>Mail Automation</h1>
  <p class="muted">Rules are evaluated in listed order after Rspamd allows a message through.</p>
  <h2>Add Rule</h2>
  <form id="rule-form">
    <label class="field"><span>Name</span><input name="name" required placeholder="Move invoices"></label>
    <label class="field"><span>Action</span><select name="action"><option value="move">Move</option><option value="none">Leave in inbox</option><option value="delete">Delete</option><option value="flag">Flag</option></select></label>
    <label class="field"><span>Subject contains</span><input name="subject" placeholder="invoice"></label>
    <label class="field"><span>Message contains</span><input name="text" placeholder="payment details"></label>
    <label class="field"><span>From address contains</span><input name="from_addr" placeholder="vendor@example.com"></label>
    <label class="field"><span>Sender name contains</span><input name="from_name" placeholder="Acme Accounts"></label>
    <label id="target-field" class="field"><span>Target folder</span><input name="target" placeholder="Finance"></label>
    <label id="flag-field" class="field hidden"><span>Flag</span><input name="flag" placeholder="\\Flagged"></label>
    <button type="submit">Add rule</button>
  </form>
  <h2>Rules</h2>
  <div class="table-wrap"><table><thead><tr><th>Name</th><th>Condition</th><th>Action</th><th>Target</th><th></th></tr></thead><tbody id="rules"></tbody></table></div>
  <h2>Recent Actions</h2>
  <div class="table-wrap"><table><thead><tr><th>Time</th><th>Subject</th><th>Sender</th><th>Rspamd</th><th>Result</th><th></th></tr></thead><tbody id="actions"></tbody></table></div>
  <script>
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    const formatCondition = condition => String(condition ?? '').replace(
      /contains\((\w+),\s*('(?:\\.|[^'])*'|"(?:\\.|[^"])*")\)/g,
      '$1 = $2',
    );
    let recentActions = [];
    async function load() {
      const [rules, actions] = await Promise.all(['/api/rules', '/api/actions'].map(url => fetch(url).then(response => response.json())));
      document.querySelector('#rules').innerHTML = rules.map(rule => `<tr><td>${escapeHtml(rule.name)}</td><td>${escapeHtml(formatCondition(rule.condition))}</td><td>${escapeHtml(rule.action)}</td><td>${escapeHtml(rule.target)}</td><td><button class="delete icon-button" type="button" aria-label="Delete rule" title="Delete rule" onclick="removeRule(${rule.id})">&#215;</button></td></tr>`).join('');
      recentActions = actions;
      document.querySelector('#actions').innerHTML = actions.map((action, index) => `<tr><td>${escapeHtml(action.created_at)}</td><td>${escapeHtml(action.subject)}</td><td>${escapeHtml(action.sender)}</td><td>${escapeHtml(action.rspamd_score)} ${escapeHtml(action.rspamd_action)}</td><td>${escapeHtml(action.rule_name)}: ${escapeHtml(action.action)} ${escapeHtml(action.target)}</td><td><button class="icon-button" type="button" aria-label="Create rule from this action" title="Create rule" onclick="makeRule(${index})">&#9998;</button></td></tr>`).join('');
    }
    async function removeRule(id) { await fetch(`/api/rules/${id}`, {method: 'DELETE'}); load(); }
    function updateActionFields() {
      const action = document.querySelector('#rule-form').elements.action.value;
      document.querySelector('#target-field').classList.toggle('hidden', action !== 'move');
      document.querySelector('#flag-field').classList.toggle('hidden', action !== 'flag');
    }
    function makeRule(index) {
      const action = recentActions[index];
      const form = document.querySelector('#rule-form');
      form.elements.name.value = `Rule for ${action.sender || action.subject}`;
      form.elements.subject.value = action.subject || '';
      form.elements.text.value = '';
      form.elements.from_addr.value = action.sender || '';
      form.elements.from_name.value = '';
      updateActionFields();
      form.scrollIntoView({behavior: 'smooth', block: 'start'});
      form.elements.action.focus();
    }
    document.querySelector('#rule-form').addEventListener('submit', async event => {
      event.preventDefault(); const values = Object.fromEntries(new FormData(event.target));
      const response = await fetch('/api/rules', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(values)});
      if (!response.ok) { alert((await response.json()).error); return; }
      event.target.reset(); load();
    });
    document.querySelector('#rule-form').elements.action.addEventListener('change', updateActionFields);
    updateActionFields();
    load(); setInterval(load, 10000);
  </script>
</body>
</html>
